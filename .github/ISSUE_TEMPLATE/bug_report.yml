name: Bug report
description: A tracking signal was reported incorrectly
labels: ["bug"]
body:
  - type: input
    id: target
    attributes:
      label: URL or fixture
      description: The page you audited, or the fixture file name
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected signal and status
      placeholder: conversion_linker -> ok
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Reported signal and status
      placeholder: conversion_linker -> missing
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `claude plugin details tracking-doctor`
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report output
      render: text
    validations:
      required: false
