name: Validate

on:
  push:
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate ./tracking-doctor --strict

  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracking-doctor/capture
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines` claims, and the current LTS. The test runner's
        # handling of positional paths differs between them, so both are load
        # bearing rather than belt-and-braces.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tracking-doctor/capture/package-lock.json
      - run: npm ci
      - name: Unit tests (no browser)
        run: npm run test:pure
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Full suite (browser-backed)
        run: npm test
