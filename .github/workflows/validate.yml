name: Validate

on:
  push:
  pull_request:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate ./tracking-doctor --strict
      - run: claude plugin validate ./ads-auditor --strict
      - name: Prove the gate catches a broken manifest
        run: |
          for plugin in tracking-doctor ads-auditor; do
            rm -rf /tmp/broken-plugin
            cp -r "$plugin" /tmp/broken-plugin
            node -e "const fs=require('fs');const p='/tmp/broken-plugin/.claude-plugin/plugin.json';const j=JSON.parse(fs.readFileSync(p));delete j.name;fs.writeFileSync(p, JSON.stringify(j));"
            if claude plugin validate /tmp/broken-plugin --strict; then
              echo "::error::claude plugin validate did not fail on a manifest missing required field 'name' ($plugin)"
              exit 1
            fi
          done

  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracking-doctor/capture
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines` claims, and the current LTS. The test runner's
        # handling of positional paths differs between them, so both are load
        # bearing rather than belt-and-braces.
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tracking-doctor/capture/package-lock.json
      - run: npm ci
      - name: Unit tests (no browser)
        run: npm run test:pure
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Full suite (browser-backed, golden fixtures diffed)
        run: npm test
        env:
          # Chromium is installed by the step above, so a self-skipped golden
          # suite here means something is wrong with browser resolution rather
          # than with the machine. Fail instead of reporting green on nothing.
          TRACKING_DOCTOR_REQUIRE_BROWSER: '1'

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ads-auditor/audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
