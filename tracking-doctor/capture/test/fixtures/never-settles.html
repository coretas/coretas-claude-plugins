<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>never settles</title>
</head>
<body>
<h1>never settles</h1>
<script>
  window.dataLayer = window.dataLayer || [];
  dataLayer.push({ event: 'heartbeat_start' });
  // A page that never goes quiet: the capture must still return something.
  var n = 0;
  setInterval(function () {
    n += 1;
    new Image().src = '/collect/heartbeat?n=' + n;
  }, 80);
</script>
</body>
</html>
