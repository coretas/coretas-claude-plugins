<title>wrong ga4 measurement id</title>
<!-- Defect: the page configures G-DECLARED1 but every hit reports G-WRONG9999,
     so the data lands in a property nobody is looking at. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('consent', 'default', { ad_storage: 'granted', analytics_storage: 'granted' });
  gtag('config', 'G-DECLARED1');
  gtag('config', 'AW-123456789');
  document.cookie = '_gcl_au=1.1.1234567890.1700000000';
</script>
<script src="https://www.googletagmanager.com/gtag/js?id=G-DECLARED1"></script>
<script src="https://www.googletagmanager.com/gtag/js?id=AW-123456789"></script>
<script src="https://connect.facebook.net/en_US/fbevents.js"></script>
</head>
<body>
<h1>wrong ga4 measurement id</h1>
<script>
  var ga4 = 'https://www.google-analytics.com/g/collect?v=2&tid=G-WRONG9999&gcs=G111&en=';
  new Image().src = ga4 + 'page_view';
  new Image().src = ga4 + 'sign_up';
  new Image().src = 'https://www.facebook.com/tr?id=1112223334445&ev=PageView';
  new Image().src = 'https://www.googleadservices.com/pagead/conversion/123456789/?label=abc123';
</script>
