<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>consent default denied</title>
<!-- Defect: consent mode defaults to denied and the banner is accepted, but no
     `consent update` ever runs, so every hit still reports G100 — denied. The
     page looks consented to a visitor and is not consented to Google. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('consent', 'default', { ad_storage: 'denied', analytics_storage: 'denied' });
  gtag('config', 'G-DENIED1');
  gtag('config', 'AW-123456789');
  document.cookie = '_gcl_au=1.1.1234567890.1700000000';
</script>
<script src="https://www.googletagmanager.com/gtag/js?id=G-DENIED1"></script>
<script src="https://www.googletagmanager.com/gtag/js?id=AW-123456789"></script>
<script src="https://connect.facebook.net/en_US/fbevents.js"></script>
</head>
<body>
<h1>consent default denied</h1>
<div id="cmp">
  <p>We use cookies.</p>
  <button id="onetrust-accept-btn-handler">Accept All</button>
</div>
<script>
  document.getElementById('onetrust-accept-btn-handler').addEventListener('click', function () {
    document.getElementById('cmp').remove();
    var ga4 = 'https://www.google-analytics.com/g/collect?v=2&tid=G-DENIED1&gcs=G100&en=';
    new Image().src = ga4 + 'page_view';
    new Image().src = ga4 + 'sign_up';
    new Image().src = 'https://www.facebook.com/tr?id=1112223334445&ev=PageView';
    new Image().src = 'https://www.googleadservices.com/pagead/conversion/123456789/?label=abc123';
  });
</script>
</body>
</html>
