<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>missing conversion linker</title>
<!-- Defect: healthy but for the linker. No _gcl_* cookie is written and no hit
     carries gclid/_gl, so ad clicks arrive with nothing to attribute them to. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('consent', 'default', { ad_storage: 'granted', analytics_storage: 'granted' });
  gtag('config', 'G-LINKER1');
  gtag('config', 'AW-123456789');
</script>
<script src="https://www.googletagmanager.com/gtag/js?id=G-LINKER1"></script>
<script src="https://www.googletagmanager.com/gtag/js?id=AW-123456789"></script>
<script src="https://connect.facebook.net/en_US/fbevents.js"></script>
</head>
<body>
<h1>missing conversion linker</h1>
<script>
  var ga4 = 'https://www.google-analytics.com/g/collect?v=2&tid=G-LINKER1&gcs=G111&en=';
  new Image().src = ga4 + 'page_view';
  new Image().src = ga4 + 'sign_up';
  new Image().src = 'https://www.facebook.com/tr?id=1112223334445&ev=PageView';
  new Image().src = 'https://www.googleadservices.com/pagead/conversion/123456789/?label=abc123';
</script>
</body>
</html>
