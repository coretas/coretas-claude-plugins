<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>duplicate gtag</title>
<!-- Defect: the gtag snippet ships twice — a hand-coded tag plus the same tag in
     a container, the usual cause. Both copies send page_view for the same
     measurement ID inside the same second, which inflates every count derived
     from it. The `_p` values differ only to defeat the memory cache; detection
     never reads them. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('consent', 'default', { ad_storage: 'granted', analytics_storage: 'granted' });
  gtag('config', 'G-DUP1');
  gtag('config', 'AW-123456789');
  document.cookie = '_gcl_au=1.1.1234567890.1700000000';
</script>
<script src="https://www.googletagmanager.com/gtag/js?id=G-DUP1"></script>
<script src="https://www.googletagmanager.com/gtag/js?id=AW-123456789"></script>
<script>
  gtag('config', 'G-DUP1');
</script>
<script src="https://www.googletagmanager.com/gtag/js?id=G-DUP1"></script>
<script src="https://connect.facebook.net/en_US/fbevents.js"></script>
</head>
<body>
<h1>duplicate gtag</h1>
<script>
  var ga4 = 'https://www.google-analytics.com/g/collect?v=2&tid=G-DUP1&gcs=G111&en=';
  new Image().src = ga4 + 'page_view&_p=1';
  new Image().src = ga4 + 'page_view&_p=2';
  new Image().src = ga4 + 'sign_up';
  new Image().src = 'https://www.facebook.com/tr?id=1112223334445&ev=PageView';
  new Image().src = 'https://www.googleadservices.com/pagead/conversion/123456789/?label=abc123';
</script>
</body>
</html>
